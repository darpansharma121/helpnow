services:
  - type: web
    name: helpnow
    runtime: node
    plan: free
    buildCommand: npm ci --prefix client && npm ci --prefix server && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_GRAPHHOPPER_API_KEY
        sync: false
